version: 0.2

phases:
  install:
    commands:
      - echo "Starting Metro Ticket Booking deployment..."

  pre_build:
    commands:
      - echo "Checking repository..."
      - ls -la

  build:
    commands:
      - echo "Deploying frontend to S3..."
      - aws s3 sync . s3://$S3_BUCKET_NAME --delete --exclude ".git/*" --exclude ".github/*" --exclude "README.md" --exclude "buildspec.yml"

  post_build:
    commands:
      - echo "Invalidating CloudFront cache..."
      - aws cloudfront create-invalidation --distribution-id $CLOUDFRONT_DISTRIBUTION_ID --paths "/*"
      - echo "Deployment completed successfully."
