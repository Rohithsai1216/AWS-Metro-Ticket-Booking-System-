<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Metro Booking</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

<nav>

    <div class="logo">
        🚇 Metro Booking
    </div>

    <ul>

        <li><a href="index.html">Home</a></li>

        <li><a href="login.html">Login</a></li>

    </ul>

<div class="container">

<h2>Create Your Metro Account</h2>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="tel"
id="mobile"
placeholder="Mobile Number">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button onclick="registerCustomer()">

Create Account

</button>

<br><br>

<p style="text-align:center;">

Already Registered?

<a href="login.html">

Login Here

</a>

</p>

</div>

<script src="js/auth/register.js"></script>
